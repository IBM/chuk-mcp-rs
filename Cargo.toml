[workspace]
resolver = "2"
members = ["crates/chuk-mcp", "crates/chuk-mcp-python"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/IBM/chuk-mcp-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tracing = "0.1"
# Already compiled as part of reqwest's dependency tree; enabling the server
# side of hyper is what lets this crate *serve* Streamable HTTP, not just
# consume it.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

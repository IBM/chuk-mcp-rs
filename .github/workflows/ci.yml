name: CI

# Every action used here is either GitHub-owned (`actions/*`) or on the
# organisation's allowlist. That is not a style preference: the org permits
# GitHub-owned, verified-creator and an explicit allowlist, and anything else
# is refused *before* a job is scheduled — the run dies at startup with no log
# to read. This file previously used `dtolnay/rust-toolchain`,
# `Swatinem/rust-cache` and `taiki-e/install-action`, and so had never once
# run. Adding an action here means checking it against that policy first.
#
# The toolchain steps below are plain `run:` lines because GitHub-hosted
# runners ship rustup and a stable toolchain already; there is nothing an
# action was buying us beyond a few seconds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (Rust core + bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version && cargo --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          # The bindings crate links libpython when extension-module is off
          # (the default for cargo builds/tests).
          PYO3_PYTHON: python3

      - name: Test
        run: cargo test --workspace
        env:
          PYO3_PYTHON: python3

      # The `auth` feature is on by default, so nothing above would notice it
      # breaking when switched off — and a caller who wants a lean build is
      # exactly the one who finds out the hard way.
      - name: Build and test without default features
        run: |
          cargo clippy -p chuk-mcp --no-default-features --all-targets -- -D warnings
          cargo test -p chuk-mcp --no-default-features

      # Benchmarks are not run in CI — the numbers would be noise on a shared
      # runner — but they are compiled, so a change to the core crate cannot
      # silently break them.
      - name: Build benchmarks
        run: cargo bench -p chuk-mcp --no-run

  conformance:
    name: Conformance (in-repo rules + official MCP suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-conformance-

      # Five stages, all blocking: our own rule suite (both eras, client and
      # server), the official @modelcontextprotocol/conformance client
      # scenarios at the legacy versions and at 2026-07-28 (authorization
      # included), and the reference server scenarios at both. Client scenarios
      # we do not pass yet would be listed in the script and reported without
      # failing the build; that list is empty.
      - name: Conformance
        run: ./scripts/run-conformance.sh

  coverage:
    name: Coverage (core crate, >=90% per file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      # Installed rather than fetched by an action, and skipped when the cache
      # already has it — a couple of minutes on a cold cache, nothing on a warm
      # one.
      - name: Install cargo-llvm-cov
        run: |
          if ! command -v cargo-llvm-cov >/dev/null; then
            cargo install cargo-llvm-cov --locked
          fi

      # The demo-server binary is a subprocess fixture llvm-cov can't observe;
      # every other source file is held at >=90% line coverage individually.
      # `--fail-under-lines` would only compare the crate total, which a single
      # badly-covered new file can hide behind, so the floor is enforced
      # per-file by scripts/coverage-gate.py instead.
      - name: Generate coverage report
        run: >
          cargo llvm-cov --package chuk-mcp
          --ignore-filename-regex 'bin/'
          --json --output-path coverage.json

      - name: Per-file coverage gate
        run: python3 scripts/coverage-gate.py coverage.json --min-lines 90

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Native builds only. The cross-compiled manylinux targets the previous
        # matrix claimed were produced by an action this organisation does not
        # permit, so they were never actually built — listing them here would
        # be describing a wheel nobody ships.
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # abi3 wheels: one build works across Python >= 3.9.
      - name: Build the wheel
        working-directory: crates/chuk-mcp-python
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/chuk-mcp-python/dist

  sdist:
    name: Source distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist
        working-directory: crates/chuk-mcp-python
        run: |
          python -m pip install --upgrade pip maturin
          maturin sdist --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/chuk-mcp-python/dist

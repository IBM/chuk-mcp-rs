name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & lint (Rust core + bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          # The bindings crate links libpython when extension-module is off
          # (the default for cargo builds/tests).
          PYO3_PYTHON: python3

      - name: Test
        run: cargo test --workspace
        env:
          PYO3_PYTHON: python3

  coverage:
    name: Coverage (core crate, >=90% per file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2

      # The demo-server binary is a subprocess fixture llvm-cov can't observe;
      # every other source file is held at >=90% line coverage individually.
      # `--fail-under-lines` would only compare the crate total, which a single
      # badly-covered new file can hide behind, so the floor is enforced
      # per-file by scripts/coverage-gate.py instead.
      - name: Generate coverage report
        run: >
          cargo llvm-cov --package chuk-mcp
          --ignore-filename-regex 'bin/'
          --json --output-path coverage.json

      - name: Per-file coverage gate
        run: python3 scripts/coverage-gate.py coverage.json --min-lines 90

  wheels:
    name: Wheels (${{ matrix.platform.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-13, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/chuk-mcp-python
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          # abi3 wheels: one build works across Python >= 3.9.
          sccache: "true"
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: crates/chuk-mcp-python/dist

  sdist:
    name: Source distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/chuk-mcp-python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/chuk-mcp-python/dist

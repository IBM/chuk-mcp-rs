name: Release

# See the note at the top of ci.yml: every action here must be GitHub-owned or
# on the organisation's allowlist, or the run dies at startup before any job is
# scheduled. That is why the toolchain and maturin are installed with `run:`
# steps rather than by actions.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to crates.io / PyPI (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- The gates, before anything is published ----------------------------
  #
  # `cargo publish` cannot be undone — a version can be yanked but never
  # replaced. Publishing straight off a tag would mean the first time these
  # checks ran against the released commit was never. So they run here, and
  # the publish job waits on them.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          PYO3_PYTHON: python3

      - name: Test
        run: cargo test --workspace
        env:
          PYO3_PYTHON: python3

      - name: Test without default features
        run: cargo test -p chuk-mcp --no-default-features

      # The crate is what is about to be published: prove it packages and
      # builds from the packaged tarball, not just from the working tree.
      - name: Package check
        run: cargo publish --dry-run -p chuk-mcp

  # ---- Rust crate -> crates.io -------------------------------------------
  publish-crate:
    name: Publish chuk-mcp to crates.io
    needs: verify
    runs-on: ubuntu-latest
    # `github.event.inputs` rather than `inputs`: the latter context does not
    # exist on a `push`, and referencing it there is itself a startup failure.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: cargo publish
        run: cargo publish -p chuk-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---- Python wheels -----------------------------------------------------
  wheels:
    name: Wheels (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # Native builds only. The cross-compiled manylinux targets the previous
        # matrix claimed were produced by an action this organisation does not
        # permit, so they were never actually built — listing them here would
        # be describing a wheel nobody ships.
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # abi3 wheels: one build works across Python >= 3.9.
      - name: Build the wheel
        working-directory: crates/chuk-mcp-python
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/chuk-mcp-python/dist

  sdist:
    name: Source distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist
        working-directory: crates/chuk-mcp-python
        run: |
          python -m pip install --upgrade pip maturin
          maturin sdist --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/chuk-mcp-python/dist

  publish-pypi:
    name: Publish chuk-mcp-rs to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # PyPI publishing is opt-in only (manual workflow_dispatch with publish=true).
    # A version tag publishes the Rust crate and builds wheels, but does not
    # push the Python bindings to PyPI.
    if: github.event.inputs.publish == 'true'
    # Trusted publishing (OIDC). Configure a PyPI trusted publisher for this
    # repo/workflow, or set MATURIN_PYPI_TOKEN and switch to a token upload.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

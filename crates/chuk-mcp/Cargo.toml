[package]
name = "chuk-mcp"
description = "Model Context Protocol (MCP) client and server library with stdio, Streamable HTTP, and SSE transports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/chrishayuk/chuk-mcp-rs"
documentation = "https://docs.rs/chuk-mcp"
readme = "README.md"
authors = ["Chris Hay <chrishayuk@googlemail.com>"]
rust-version = "1.79"
keywords = ["llm", "mcp", "client", "protocol"]
categories = ["network-programming", "api-bindings", "asynchronous"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
uuid.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
async-trait.workspace = true
tracing-subscriber = "0.3"

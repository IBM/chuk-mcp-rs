[package]
name = "chuk-mcp"
description = "Model Context Protocol (MCP) client and server for the 2026-07-28 and legacy revisions, over stdio and Streamable HTTP, with OAuth 2.1 authorization"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/chrishayuk/chuk-mcp-rs"
documentation = "https://docs.rs/chuk-mcp"
readme = "README.md"
authors = ["Chris Hay <chrishayuk@googlemail.com>"]
rust-version = "1.79"
keywords = ["llm", "mcp", "client", "server", "protocol"]
categories = ["network-programming", "api-bindings", "asynchronous"]

[features]
default = ["auth"]
# OAuth 2.1 authorization: metadata discovery, PKCE, the authorization code
# flow and token refresh. On by default — a server that starts requiring auth
# should not fail against a client that merely built without a feature flag.
auth = ["dep:sha2"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
uuid.workspace = true
async-trait.workspace = true
base64.workspace = true
sha2 = { workspace = true, optional = true }
reqwest.workspace = true
tracing.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
async-trait.workspace = true
tracing-subscriber = "0.3"
criterion = "0.5"

[[bench]]
name = "protocol"
path = "benches/protocol/main.rs"
harness = false

# The fixtures the reference conformance suite requires are many and varied
# enough to want a module each, so this binary is a directory rather than a
# file. The name is what `scripts/run-conformance.sh` invokes.
[[bin]]
name = "chuk-mcp-conformance-server"
path = "src/bin/conformance_server/main.rs"

[package]
name = "chuk-mcp-python"
description = "Python bindings for chuk-mcp (Rust core)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "chuk_mcp_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
chuk-mcp = { path = "../chuk-mcp" }
pyo3 = { version = "0.23", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
pythonize = "0.23"
serde_json.workspace = true
tokio.workspace = true

[features]
# Enabled by maturin when building the Python extension (see pyproject.toml).
# Left off for plain `cargo build`/`cargo test` so the crate links libpython
# and standalone test binaries build.
extension-module = ["pyo3/extension-module"]
